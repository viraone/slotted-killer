name: Update BARK performer list

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check BARK for the current 6th & Proctor list
        run: node scripts/update-bark-list.mjs

      - name: Commit a changed performer-list URL
        run: |
          if git diff --quiet -- data/open-mics.json; then
            echo "BARK performer-list URL is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open-mics.json
          git commit -m "Update BARK 6th & Proctor performer list"
          git push
